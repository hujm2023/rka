name: 问题反馈
description: 报告可复现的功能或部署问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实密钥、个人学习备份或包含私人数据的完整日志。安全漏洞请先阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 标签、镜像标签或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、CPU 架构、Docker/Compose 版本、浏览器及部署方式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
